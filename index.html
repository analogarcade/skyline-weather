<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline Weather</title>
<style>
:root{--bg:#07111f;--panel:#10233b;--panel2:#162f4d;--line:#294463;--text:#f3f7fc;--muted:#9bb0c8;--accent:#8bd5ff;--warm:#ffc875}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 10%,#183d60 0,#07111f 45%);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1120px;margin:auto;padding:28px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:44px}.logo{font-size:19px;font-weight:750;letter-spacing:-.04em}.logo span{color:var(--accent)}.top-actions{display:flex;gap:8px}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#ffffff08;border-radius:9px;padding:9px 12px}button:hover{background:#ffffff12;border-color:#4b7197}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.location{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.location h1{font-size:clamp(30px,6vw,62px);line-height:1;margin:8px 0 0;letter-spacing:-.06em}.sub{color:var(--muted);margin-top:12px}.search{display:flex;gap:8px;max-width:360px;width:100%}.search input{width:100%;background:#08182a;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text)}.primary{background:var(--accent);color:#062039;border-color:var(--accent);font-weight:700}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}.card{background:linear-gradient(145deg,#153353,#0d2036);border:1px solid var(--line);border-radius:18px;padding:24px}.current{min-height:270px;position:relative;overflow:hidden}.current:after{content:'☼';position:absolute;right:25px;top:18px;font-size:120px;line-height:1;color:#8bd5ff18}.condition{color:var(--warm);font-size:14px;font-weight:650}.temp{font-size:86px;line-height:.95;letter-spacing:-.08em;margin:21px 0 10px}.temp small{font-size:24px;color:var(--muted);letter-spacing:0;vertical-align:top;margin-left:5px}.feels{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#ffffff08;border:1px solid #ffffff12;border-radius:12px;padding:16px}.metric b{display:block;font-size:22px;margin-top:5px}.metric span{color:var(--muted);font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 12px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#10243c;border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}.day.today{border-color:var(--accent);background:#153453}.day strong{display:block;font-size:12px}.day .emoji{font-size:26px;margin:14px 0 8px}.day .high{font-weight:700}.day .low{color:var(--muted);font-size:12px;margin-top:3px}.status{min-height:24px;color:var(--muted);font-size:13px;margin-top:10px}.error{color:#ffaaa3}.source{color:var(--muted);font-size:12px;margin-top:28px}.source a{color:var(--accent)}@media(max-width:760px){.location{display:block}.search{margin-top:20px;max-width:none}.hero{grid-template-columns:1fr}.forecast{grid-template-columns:repeat(4,1fr)}.day:nth-child(n+6){display:none}}@media(max-width:430px){.shell{padding:20px 14px}.top{margin-bottom:32px}.top-actions button{padding:8px}.card{padding:20px}.temp{font-size:72px}.forecast{grid-template-columns:repeat(3,1fr)}}
</style><style>
html,body{height:100%;overflow:hidden}.shell{height:100vh;min-height:0;display:flex;flex-direction:column;padding:clamp(10px,2.5vh,24px) clamp(14px,3vw,22px) clamp(10px,2.5vh,18px)}.top{margin-bottom:clamp(12px,3vh,28px)}.location{margin-bottom:8px}.hero{margin-bottom:4px}.current{min-height:0}.card{padding:clamp(14px,2vw,24px);transition:transform .18s ease,border-color .18s ease,background .18s ease}.card:hover{transform:translateY(-2px);border-color:#477096}.metric{padding:clamp(10px,1.5vw,16px);transition:background .18s ease,transform .18s ease}.metric:hover{background:#ffffff12;transform:translateY(-1px)}.day{padding:clamp(8px,1vw,14px) 6px;transition:transform .18s ease,border-color .18s ease}.day:hover{transform:translateY(-3px);border-color:#477096}.day .emoji{margin:clamp(7px,1.5vh,14px) 0 6px}.status{min-height:18px}.source{margin-top:auto;padding-top:8px}#locate{display:none}
</style></head>
<body><main class="shell"><header class="top"><div class="logo"><span>✦</span> Skyline</div><div class="top-actions"><button id="locate" title="Use your current location">⌖ Locate me</button><button id="refresh" title="Refresh weather">↻</button></div></header>
<section class="location"><div><div class="eyebrow">Live conditions</div><h1 id="place">Choose a city</h1><div class="sub" id="updated">Search for a place to see the sky.</div></div><form class="search" id="searchForm"><input id="city" placeholder="Search city…" autocomplete="off" required><button class="primary">Search</button></form></section>
<div class="status" id="status"></div><section class="hero"><div class="card current"><div class="condition" id="condition">—</div><div class="temp" id="temp">—<small>°C</small></div><div class="feels" id="feels">Feels like —</div></div><div class="card metrics"><div class="metric"><span>Humidity</span><b id="humidity">—</b></div><div class="metric"><span>Wind</span><b id="wind">—</b></div><div class="metric"><span>Sunrise</span><b id="sunrise">—</b></div><div class="metric"><span>Sunset</span><b id="sunset">—</b></div></div></section>
<div class="section-head"><h2>Seven-day outlook</h2><span id="units">Celsius · local time</span></div><section class="forecast" id="forecast"></section><div class="source">Live weather data from Open-Meteo · no account or setup required.</div></main>
<script>
(()=>{const $=s=>document.querySelector(s),code={0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Rime fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],80:['Showers','🌦️'],81:['Showers','🌧️'],82:['Heavy showers','⛈️'],95:['Thunderstorm','⛈️'],96:['Storm','⛈️'],99:['Storm','⛈️']};let place={name:'',lat:0,lon:0,tz:'auto'};
function say(t,err=false){$('#status').textContent=t;$('#status').className='status'+(err?' error':'')}function fmt(t){return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function weather(codeVal){return code[codeVal]||['Mixed conditions','🌡️']}function setLoading(t){say(t);$('#refresh').disabled=true}function done(){say('');$('#refresh').disabled=false}
async function geocode(name){let r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(name)+'&count=1&language=en&format=json');if(!r.ok)throw Error();let d=await r.json();if(!d.results?.length)throw Error('No city found.');return d.results[0]}
async function load(p){place={name:p.name,lat:p.latitude,lon:p.longitude,tz:p.timezone||'auto'};let u='https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&timezone=auto&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=7';let r=await fetch(u);if(!r.ok)throw Error();let d=await r.json(),c=d.current;$('#place').textContent=p.name+ (p.country_code?' · '+p.country_code:'');$('#updated').textContent='Updated '+fmt(c.time)+' · '+(p.admin1||'local forecast');let w=weather(c.weather_code);$('#condition').textContent=w[0];$('#temp').innerHTML=Math.round(c.temperature_2m)+'<small>°C</small>';$('#feels').textContent='Feels like '+Math.round(c.apparent_temperature)+'°';$('#humidity').textContent=c.relative_humidity_2m+'%';$('#wind').textContent=Math.round(c.wind_speed_10m)+' km/h';$('#sunrise').textContent=fmt(d.daily.sunrise[0]);$('#sunset').textContent=fmt(d.daily.sunset[0]);$('#forecast').innerHTML=d.daily.time.map((day,i)=>{let x=weather(d.daily.weather_code[i]);return`<div class="day ${i===0?'today':''}"><strong>${i===0?'Today':new Date(day).toLocaleDateString([],{weekday:'short'})}</strong><div class="emoji">${x[1]}</div><div class="high">${Math.round(d.daily.temperature_2m_max[i])}°</div><div class="low">${Math.round(d.daily.temperature_2m_min[i])}°</div></div>`}).join('');localStorage.setItem('skyline-weather-place',JSON.stringify(place));done()}
async function search(name){setLoading('Finding '+name+'…');try{let p=await geocode(name);await load(p)}catch(e){say(e.message||'Could not load weather. Check your connection and try again.',true);$('#refresh').disabled=false}}
$('#searchForm').onsubmit=e=>{e.preventDefault();search($('#city').value.trim())};$('#refresh').onclick=()=>place.name&&load({name:place.name,latitude:place.lat,longitude:place.lon,timezone:place.tz});$('#locate').onclick=()=>{if(!navigator.geolocation)return say('Location is not available in this browser.',true);setLoading('Locating you…');navigator.geolocation.getCurrentPosition(async p=>{try{let r=await fetch('https://geocoding-api.open-meteo.com/v1/reverse?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&count=1&language=en&format=json'),d=await r.json();await load(d.results?.[0]||{name:'Your location',latitude:p.coords.latitude,longitude:p.coords.longitude})}catch{say('Could not resolve your location.',true);$('#refresh').disabled=false}},()=>{say('Location permission was declined.',true);$('#refresh').disabled=false},{timeout:8000})};try{let p=JSON.parse(localStorage.getItem('skyline-weather-place'));if(p?.name)load({name:p.name,latitude:p.lat,longitude:p.lon,timezone:p.tz});else search('London')}catch{search('London')}})();
</script><script>
// Keep Enter submission explicit for browsers opening this file directly.
document.querySelector('#city').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();document.querySelector('#searchForm').requestSubmit()}});
</script></body></html>
